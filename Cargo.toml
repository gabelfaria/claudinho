[package]
name = "claudinho"
version = "1.0.0"
edition = "2024"
description = "Assistente de mesa para Windows: uma bolha flutuante que conversa com o Claude Code o dia inteiro, com memória longa, lembretes e baixo consumo."
license = "MIT"
readme = "README.md"
autobins = false

# vigia residente (bolha, bandeja, lembretes, verificações)
[[bin]]
name = "claudinho"
path = "src/bin/claudinho.rs"

# janela de conversa
[[bin]]
name = "claudinho-ui"
path = "src/bin/claudinho-ui.rs"

# popup avulso para scripts perguntarem algo ao usuário
[[bin]]
name = "claudinho-popup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
